name: Feature request
description: Suggest an idea for ClipForge.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Awesome. Help us understand the *why* — that's usually more important than the *what*.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point or workflow gap. Skip the solution for a sec.
      placeholder: "When I export clips to CapCut, I have to manually re-add captions."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should ClipForge do?
      placeholder: "Add a 'CapCut + captions bundle' export that includes both timings and animated captions."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and rejected, or workarounds you currently use.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - YouTube import / transcript
        - AI clip detection
        - Captions
        - Exports
        - UI / UX
        - BYOK / providers
        - Deployment / self-hosting
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots, examples from other tools, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm willing to help implement or test this.
          required: false
